<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneStep</title>
    <link rel="icon" type="image" href="logo.svg">
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0a;
        --panel: #111111;
        --border: rgba(255, 255, 255, 0.08);
        --accent: #ffffff;
        --text-main: #eeeeee;
        --text-dim: #666666;
        --health: #2ecc71;
        --work: #3498db;
        --mind: #9b59b6;
        --personal: #f1c40f;
      }

      /* UI Reset & Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      
      ::-webkit-scrollbar {
        display: none;
      }
      
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      body {
        background: var(--bg);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }

      .app-container {
        width: 100%;
        max-width: 1100px;
        padding: 2rem 1.5rem 5rem 1.5rem;
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 2.5rem;
      }

      header {
        grid-column: 1 / -1;
        border-bottom: 1px solid var(--border);
        padding-bottom: 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand-section {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      
      .logo-container {
        width: 45px;
        height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 5px;
      }
      
      .logo-container svg {
        width: 100%;
        height: 100%;
        fill: var(--accent);
      }

      .time-display-right {
        text-align: right;
      }
      
      .time-display-right h1 {
        font-size: 2.2rem;
        font-weight: 600;
        letter-spacing: -1px;
        line-height: 1;
      }
      
      .time-display-right p {
        color: var(--text-dim);
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 1.5px;
        margin-top: 4px;
      }

      .category-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 1.5rem;
        overflow-x: auto;
        align-items: center;
        padding-bottom: 5px;
        -webkit-overflow-scrolling: touch;
      }
      
      .cat-chip {
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 0.75rem;
        font-weight: 500;
        background: transparent;
        border: 1px solid var(--border);
        cursor: pointer;
        transition: 0.2s;
        color: var(--text-dim);
        white-space: nowrap;
      }
      
      .cat-chip.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      
      .edit-trigger {
        border: 1px dashed var(--border);
        padding: 6px 12px;
        font-size: 1.1rem;
        line-height: 1;
      }

      .habit-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
        overflow-y: auto;
        max-height: calc(100vh - 280px);
        padding-bottom: 40px;
      }

      .habit-card {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 14px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        min-width: 0;
        overflow: hidden;
      }

      .habit-info {
        flex: 1;
        min-width: 0;
        margin-right: 12px;
      }
      
      .habit-info h4 {
        font-size: 0.95rem;
        font-weight: 500;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      
      .habit-info p {
        font-size: 0.65rem;
        color: var(--text-dim);
        font-weight: 600;
        text-transform: uppercase;
      }

      .card-actions {
        display: flex;
        gap: 6px;
        opacity: 0;
        transition: 0.2s;
        position: absolute;
        right: 45px;
      }
      
      .habit-card:hover .card-actions {
        opacity: 1;
      }

      .action-btn {
        background: #1a1a1a;
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-size: 0.6rem;
        padding: 4px 8px;
        border-radius: 5px;
        cursor: pointer;
      }

      .check-btn {
        min-width: 26px;
        height: 26px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: transparent;
        cursor: pointer;
        color: transparent;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .done .check-btn {
        background: var(--accent);
        color: black;
        border-color: var(--accent);
      }
      
      .done h4 {
        text-decoration: line-through;
        opacity: 0.5;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 180px);
      }
      
      .score-panel {
        background: linear-gradient(145deg, #161616, #111);
    padding: 0.4rem;
    border-radius: 16px;
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
      }

      .circle-gauge {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: radial-gradient(closest-side, #111 80%, transparent 0),
          conic-gradient(var(--accent) 0%, var(--border) 0%);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        transition: 0.4s ease-out;
      }
      
      .circle-gauge h2 {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--accent);
      }

      .monthly-stats {
        margin-top: 7px;
        padding-top: 7px;
        border-top: 1px solid var(--border);
        width: 100%;
        text-align: center;
      }

      .history-container {
        flex-grow: 1;
        overflow-y: auto;
        margin-bottom: 1.5rem;
        max-height: 290px;
      }
      
      .history-item {
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .btn-main {
        background: var(--accent);
        color: black;
        border: none;
        padding: 14px;
        width: 100%;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 10px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      
      .modal {
        background: #161616;
        padding: 1.5rem;
        border-radius: 16px;
        width: 90%;
        max-width: 350px;
        border: 1px solid var(--border);
      }
      
      input, select {
        width: 100%;
        background: #000;
        border: 1px solid var(--border);
        padding: 12px;
        color: white;
        border-radius: 8px;
        margin: 10px 0;
        outline: none;
      }

      .empty-state {
        grid-column: 1 / -1;
        padding: 3rem 1rem;
        text-align: center;
        border: 1px dashed var(--border);
        border-radius: 12px;
        color: var(--text-dim);
      }

      .quote-container {
        margin-top: auto;
        padding: 0.8rem 0;
        text-align: center;
        opacity: 0.4;
      }
      
      .quote-text {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 500;
        font-style: italic;
      }

      /* ===== MOBILE RESPONSIVENESS FIX ===== */
      @media (max-width: 850px) {
        .app-container {
          grid-template-columns: 1fr;
          padding: 1rem;
          gap: 1rem;
        }

        header {
          flex-direction: row;
          padding-bottom: 1rem;
          margin-bottom: 1rem;
        }

        .brand-section h2 {
          font-size: 1.2rem;
        }

        .logo-container {
          width: 35px;
          height: 35px;
        }

        .time-display-right h1 {
          font-size: 1.5rem;
        }

        .habit-grid {
          max-height: none;
          grid-template-columns: 1fr;
        }

        .sidebar {
          height: auto;
          order: 2; /* Move sidebar below the main grid on mobile */
        }

        main {
          order: 1;
        }

        .card-actions {
          opacity: 1;
          position: static;
          margin-right: 8px;
        }

        .habit-card {
          padding: 16px;
        }

        .score-panel {
          margin-top: 2rem;
        }

        .history-container {
          max-height: 250px;
        }
      }

      @media (max-width: 480px) {
        .time-display-right p {
          display: none; /* Hide date label on very small screens to save space */
        }
        
        .cat-chip {
          padding: 6px 10px;
          font-size: 0.7rem;
        }
      }
    </style>
  </head>

        <div class="brand-section">

            </svg>
          </div>
          <div>
            <h2 style="font-size: 1.5rem; font-weight: 600">OneStep</h2>
          </div>
        </div>
        <div class="time-display-right">
          <h1 id="clockLabel">00:00</h1>
          <p id="dateLabel">--</p>
        </div>
      </header>

      <main>
        <div class="category-bar" id="catBar">
          <div class="cat-chip active" onclick="filterHabits('all', this)">
            All
          </div>
          <div id="dynamicChips" style="display: flex; gap: 8px"></div>
          <div class="cat-chip edit-trigger" onclick="openCatModal()">+</div>
        </div>
        <div class="habit-grid" id="habitGrid"></div>
      </main>

      <aside class="sidebar">
        <div class="quote-container">
          <p class="quote-text">one percent better everyday</p>
        </div>
        <button class="btn-main" onclick="openHabitModal()">+ New Habit</button>
        <div class="score-panel">
          <div class="circle-gauge" id="gaugeContainer">
            <h2 id="dailyRatio">0%</h2>
          </div>
          <p style="font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">
            Daily Goal
          </p>
          <div class="monthly-stats">
            <h3 id="monthlyRatio" style="font-size: 1.1rem; color: var(--accent)">0%</h3>
            <p style="font-size: 0.55rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">
              Monthly Average
            </p>
          </div>
        </div>
        
        <p style="font-size: 0.7rem; color: var(--text-dim); letter-spacing: 1.5px; margin-bottom: 1rem; font-weight: 600;">
          LAST 30 DAYS
        </p>
        <div class="history-container"><div id="historyList"></div></div>

        
      </aside>
    </div>

    <div class="overlay" id="habitModal">
      <div class="modal">
        <h3 id="habitModalTitle">Add Task</h3>
        <input type="text" id="habitTitle" placeholder="Task description..." />
        <select id="habitCatSelect"></select>
        <button class="btn-main" onclick="saveHabit()">Save</button>
        <button class="btn-main" style="background: transparent; color: var(--text-dim)" onclick="closeModals()">Cancel</button>
      </div>
    </div>

    <div class="overlay" id="catModal">
      <div class="modal">
        <h3>Categories</h3>
        <input type="text" id="newCatTitle" placeholder="New category name..." />
        <button class="btn-main" onclick="addCategory()">Add</button>
        <div id="catManageList" style="margin-top: 15px; max-height: 150px; overflow-y: auto"></div>
        <button class="btn-main" style="background: transparent; color: var(--text-dim); margin-top: 10px;" onclick="closeModals()">Close</button>
      </div>
    </div>

    <script>
      const KEY = "ORBIT_ULTIMATE_V1";
      let state = JSON.parse(localStorage.getItem(KEY)) || {
        habits: [],
        categories: ["health", "work", "mind", "personal"],
        currentFilter: "all",
      };
      let editingHabitId = null;

      function updateClock() {
        const now = new Date();
        document.getElementById("clockLabel").innerText =
          now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
        document.getElementById("dateLabel").innerText = now
          .toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })
          .toUpperCase();
      }
      setInterval(updateClock, 1000);
      updateClock();

      const getToday = () => new Date().toISOString().split("T")[0];

      function openHabitModal(id = null) {
        editingHabitId = id;
        const select = document.getElementById("habitCatSelect");
        select.innerHTML = state.categories
          .map((c) => `<option value="${c}">${c.toUpperCase()}</option>`)
          .join("");
        
        if (id) {
          const h = state.habits.find((x) => x.id === id);
          document.getElementById("habitTitle").value = h.title;
          document.getElementById("habitCatSelect").value = h.category;
          document.getElementById("habitModalTitle").innerText = "Edit Task";
        } else {
          document.getElementById("habitTitle").value = "";
          document.getElementById("habitModalTitle").innerText = "Add Task";
        }
        document.getElementById("habitModal").style.display = "flex";
      }

      function openCatModal() {
        renderCatManager();
        document.getElementById("catModal").style.display = "flex";
      }
      
      function closeModals() {
        document.querySelectorAll(".overlay").forEach((o) => (o.style.display = "none"));
        editingHabitId = null;
      }

      function addCategory() {
        const name = document.getElementById("newCatTitle").value.toLowerCase().trim();
        if (name && !state.categories.includes(name)) {
          state.categories.push(name);
          document.getElementById("newCatTitle").value = "";
          save();
          renderCatManager();
        }
      }

      function deleteCategory(cat) {
        if (confirm(`Delete category "${cat}"?`)) {
          state.categories = state.categories.filter((c) => c !== cat);
          save();
          renderCatManager();
        }
      }

      function saveHabit() {
        const title = document.getElementById("habitTitle").value;
        const category = document.getElementById("habitCatSelect").value;
        if (!title) return;
        if (editingHabitId) {
          const h = state.habits.find((x) => x.id === editingHabitId);
          h.title = title;
          h.category = category;
        } else {
          state.habits.push({ id: Date.now(), title, category, history: {} });
        }
        closeModals();
        save();
      }

      function toggleHabit(id) {
        const today = getToday();
        const h = state.habits.find((x) => x.id === id);
        h.history[today] = !h.history[today];
        save();
      }

      function deleteHabit(id) {
        if (confirm("Delete this task?")) {
          state.habits = state.habits.filter((x) => x.id !== id);
          save();
        }
      }

      function filterHabits(cat, el) {
        state.currentFilter = cat;
        document.querySelectorAll(".cat-chip").forEach((c) => c.classList.remove("active"));
        el.classList.add("active");
        render();
      }

      function save() {
        localStorage.setItem(KEY, JSON.stringify(state));
        render();
      }

      function renderCatManager() {
        const list = document.getElementById("catManageList");
        list.innerHTML = state.categories
          .map((c) => `
            <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border);">
                <span style="text-transform:uppercase; font-size:0.75rem;">${c}</span>
                <span style="color:#ff4757; cursor:pointer; font-size:0.7rem; font-weight:bold;" onclick="deleteCategory('${c}')">DELETE</span>
            </div>
          `).join("");
      }

      function render() {
        const chipBox = document.getElementById("dynamicChips");
        chipBox.innerHTML = state.categories
          .map((c) => `
            <div class="cat-chip ${state.currentFilter === c ? "active" : ""}" onclick="filterHabits('${c}', this)">
                ${c.charAt(0).toUpperCase() + c.slice(1)}
            </div>
          `).join("");

        const grid = document.getElementById("habitGrid");
        grid.innerHTML = "";
        const today = getToday();
        const filtered = state.currentFilter === "all"
            ? state.habits
            : state.habits.filter((h) => h.category === state.currentFilter);

        if (filtered.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
                <p>No tasks found in this category.</p>
                <button class="action-btn" style="margin-top:10px" onclick="openHabitModal()">+ Create One</button>
            </div>
          `;
        } else {
          filtered.forEach((h) => {
            const isDone = !!h.history[today];
            const card = document.createElement("div");
            card.className = `habit-card ${isDone ? "done" : ""}`;
            card.innerHTML = `
              <div class="habit-info">
                  <h4>${h.title}</h4>
                  <p style="color:var(--${h.category}, var(--text-dim))">${h.category}</p>
              </div>
              <div class="card-actions">
                  <button class="action-btn" onclick="openHabitModal(${h.id})">Edit</button>
                  <button class="action-btn" onclick="deleteHabit(${h.id})">✕</button>
              </div>
              <button class="check-btn" onclick="toggleHabit(${h.id})">✓</button>
            `;
            grid.appendChild(card);
          });
        }

        const active = state.habits.filter((h) => h.history[today]).length;
        const total = state.habits.length;
        const ratio = total ? Math.round((active / total) * 100) : 0;
        document.getElementById("dailyRatio").innerText = ratio + "%";
        document.getElementById("gaugeContainer").style.background = `
            radial-gradient(closest-side, #111 80%, transparent 0),
            conic-gradient(var(--accent) ${ratio}%, var(--border) 0%)
        `;

        let totalMonthlyPerc = 0;
        const daysToTrack = 30;
        for (let i = 0; i < daysToTrack; i++) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dStr = d.toISOString().split("T")[0];
          const dailyCount = state.habits.filter((h) => h.history[dStr]).length;
          totalMonthlyPerc += total ? dailyCount / total : 0;
        }
        document.getElementById("monthlyRatio").innerText = Math.round((totalMonthlyPerc / daysToTrack) * 100) + "%";
        renderHistory();
      }

      function renderHistory() {
        const list = document.getElementById("historyList");
        list.innerHTML = "";
        for (let i = 0; i < 30; i++) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dStr = d.toISOString().split("T")[0];
          const count = state.habits.filter((h) => h.history[dStr]).length;
          const perc = state.habits.length ? Math.round((count / state.habits.length) * 100) : 0;
          list.innerHTML += `
            <div class="history-item">
                <span style="font-size:0.8rem; color:var(--text-dim);">${d.toLocaleDateString("en-US", { weekday: "short", day: "numeric" })}</span>
                <span style="font-weight:600; color:${perc > 0 ? "var(--accent)" : "var(--text-dim)"}">${perc}%</span>
            </div>`;
        }
      }
      render();
    </script>
  </body>
</html>
